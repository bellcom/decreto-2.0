    _permission: 'access content'
    node: \d+
decreto_content_modify.bpas_add:
  path: '/bullet_points/{bullet_point}/bullet_point_attachments/add'
  options:
    parameters:
      bullet_point:
        type: entity:node
  defaults:
    _title: 'Decreto add bullet point attachment'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointAttachmentEditForm'
    node: null
  requirements:
    _permission: 'access content'
    bullet_point: \d+
decreto_content_modify.bpas_edit:
  path: '/bullet_points/{bullet_point}/bullet_point_attachments/{node}/edit'
  options:
    parameters:
      bullet_point:
        type: entity:node
      node:
        type: entity:node
  defaults:
