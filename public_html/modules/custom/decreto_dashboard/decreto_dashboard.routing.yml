decreto_dashboard.meetings.block:
  path: '/dashboard'
  defaults:
    _controller: '\Drupal\decreto_dashboard\Controller\DashboardController::meetingsBlock'
    _title: 'Dashboard'
  requirements:
    _permission: 'access content'

decreto_dashboard.meetings.page:
  path: '/dashboard/{committee}'
  defaults:
    _controller: '\Drupal\decreto_dashboard\Controller\DashboardController::meetingsPage'
    _title: 'Dashboard'
  requirements:
    _permission: 'access content'