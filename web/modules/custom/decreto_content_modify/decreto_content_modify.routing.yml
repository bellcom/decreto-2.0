decreto_content_modify.meetings_add:
  path: '/meetings/add'
  options:
    parameters:
      node:
        type: entity:node
  defaults:
    _title: 'Decreto edit meeting'
    _form: '\Drupal\decreto_content_modify\Form\MeetingsEditForm'
    node: null
  requirements:
    _permission: 'access content'
decreto_content_modify.meetings_edit:
  path: '/meetings/{node}/edit'
  options:
    parameters:
      node:
        type: entity:node
  defaults:
    _title: 'Decreto edit meeting'
    _form: '\Drupal\decreto_content_modify\Form\MeetingsEditForm'
  requirements:
    _permission: 'access content'
    node: \d+
decreto_content_modify.bps_add:
  path: '/bullet_points/add'
  options:
    parameters:
      node:
        type: entity:node
  defaults:
    _title: 'Decreto add bullet point'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointEditForm'
