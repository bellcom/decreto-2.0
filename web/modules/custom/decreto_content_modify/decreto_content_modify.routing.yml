decreto_content_modify.user_edit:
  path: '/user/edit'
  defaults:
    _controller: '\Drupal\decreto_content_modify\Controller\UserController::redirectToEditPage'
  requirements:
    _permission: 'access content'

contnet_modify.memo_popup_content:
  path: 'ajax/memos-popup'
  defaults:
    _controller: '\Drupal\decreto_content_modify\Controller\MemoController::popupContentRender'
  requirements:
    _permission: 'access content'