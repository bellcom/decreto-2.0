decreto_content_modify.memo_popup_content:
  path: 'ajax/memos-popup'
  defaults:
    _controller: '\Drupal\decreto_content_modify\Controller\MemoController::popupContentRender'
  requirements:
    _permission: 'access content'

decreto_content_modify.meetings_add:
  path: '/meetings/add'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_content_modify\Form\MeetingEditForm::getTitle'
    _form: '\Drupal\decreto_content_modify\Form\MeetingEditForm'
    meeting: null
  requirements:
    _custom_access: '\Drupal\decreto_content_modify\Controller\AccessController::createMeetingAccess'
decreto_content_modify.meetings_edit:
  path: '/meetings/{meeting}/edit'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_content_modify\Form\MeetingEditForm::getTitle'
    _form: '\Drupal\decreto_content_modify\Form\MeetingEditForm'
  requirements:
    _entity_access: 'meeting.update'
    meeting: \d+

decreto_content_modify.bps_add:
  path: '/meetings/{meeting}/add-bp'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_content_modify\Form\BulletPointsAddForm::getTitle'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointsAddForm'
  requirements:
    _custom_access: '\Drupal\decreto_content_modify\Controller\AccessController::createBulletPointAccess'
    meeting: \d+

decreto_content_modify.bps_add_from_files:
  path: '/meetings/{meeting}/add-bp-from-files'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_content_modify\Form\BulletPointsAddFromFilesForm::getTitle'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointsAddFromFilesForm'
  requirements:
    _custom_access: '\Drupal\decreto_content_modify\Controller\AccessController::createBulletPointAccess'
    meeting: \d+

decreto_content_modify.bps_edit:
