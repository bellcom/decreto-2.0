decreto_content_modify.memo_popup_content:
  path: 'ajax/memos-popup'
  defaults:
    _controller: '\Drupal\decreto_content_modify\Controller\MemoController::popupContentRender'
  requirements:
    _permission: 'access content'

decreto_content_modify.meetings_add:
  path: '/meetings/add'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_content_modify\Form\MeetingsEditForm::getTitle'
    _form: '\Drupal\decreto_content_modify\Form\MeetingsEditForm'
    meeting: null
  requirements:
    _permission: 'create decreto_meeting content'
decreto_content_modify.meetings_edit:
  path: '/meetings/{meeting}/edit'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_content_modify\Form\MeetingsEditForm::getTitle'
    _form: '\Drupal\decreto_content_modify\Form\MeetingsEditForm'
  requirements:
    _permission: 'edit any decreto_meeting content'
    meeting: \d+

decreto_content_modify.bps_add:
  path: '/meetings/{meeting}/add-bp'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title: 'Decreto add bullet point'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointsAddForm'
  requirements:
    _permission: 'create decreto_bullet_point content'
    meeting: \d+

decreto_content_modify.bps_add_from_files:
  path: '/meetings/{meeting}/add-bp-from-files'
  options:
    parameters:
      meeting:
        type: entity:node
  defaults:
    _title: 'Decreto add bullet point from files'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointsAddFromFilesForm'
  requirements:
    _permission: 'create decreto_bullet_point content'
    meeting: \d+

decreto_content_modify.bps_edit:
  path: '/bullet-points/{bullet_point}/edit'
  options:
    parameters:
      bullet_point:
        type: entity:node
  defaults:
    _title: 'Decreto edit bullet point'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointEditForm'
  requirements:
    _permission: 'edit any decreto_bullet_point content'
    bullet_point: \d+

decreto_content_modify.bps_delete:
  path: '/bullet-points/{node}/delete'
  options:
    parameters:
      node:
        type: entity:node
  defaults:
    _title: 'Decreto delete bullet point'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointDeleteForm'
  requirements:
    _permission: 'delete any decreto_bullet_point content'
    node: \d+

decreto_content_modify.bpas_modal:
  path: '/bullet-point-attachments/{bullet_point_attachment}/modal'
  options:
    parameters:
      bullet_point_attachment:
        type: entity:node
  defaults:
    _title: 'Decreto bullet point attachment modal'
    _controller: '\Drupal\decreto_content_modify\Controller\BulletPointAttachmentController::modalContentRender'
  requirements:
    _permission: 'access content'
    bullet_point_attachment: \d+

decreto_content_modify.bpas_add:
  path: '/bullet-points/{bullet_point}/add-bpa'
  options:
    parameters:
      bullet_point:
        type: entity:node
  defaults:
    _title: 'Decreto add bullet point attachment'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointAttachmentsAddForm'
  requirements:
    _permission: 'create decreto_bullet_attachment content'
    bullet_point: \d+

decreto_content_modify.bpas_edit:
  path: '/bullet-point-attachments/{bullet_point_attachment}/edit'
  options:
    parameters:
      bullet_point_attachment:
        type: entity:node
  defaults:
    _title: 'Decreto edit bullet point attachment'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointAttachmentEditForm'
  requirements:
    _permission: 'edit any decreto_bullet_point_attachment content'
    bullet_point: \d+

decreto_content_modify.bpas_delete:
  path: '/bullet-point-attachments/{node}/delete'
  options:
    parameters:
      node:
        type: entity:node
  defaults:
    _title: 'Decreto delete bullet point attachment'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointAttachmentDeleteForm'
  requirements:
    _permission: 'delete any decreto_bullet_point_attachment content'
    node: \d+

