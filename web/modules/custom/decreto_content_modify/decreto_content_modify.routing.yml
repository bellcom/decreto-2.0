    bullet_point: \d+
decreto_content_modify.bpas_edit:
  path: '/bullet_points/{bullet_point}/bullet_point_attachments/{node}/edit'
  options:
    parameters:
      bullet_point:
        type: entity:node
      node:
        type: entity:node
  defaults:
    _title: 'Decreto edit bullet point attachment'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointAttachmentEditForm'
  requirements:
    _permission: 'access content'
    bullet_point: \d+
    node: \d+
decreto_content_modify.bpas_delete:
  path: '/bullet_points/{parent}/bullet_point_attachments/{node}/delete'
  options:
    parameters:
      parent:
        type: entity:node
      node:
        type: entity:node
  defaults:
    _title: 'Decreto delete bullet point attachment'
    _form: '\Drupal\decreto_content_modify\Form\BulletPointAttachmentDeleteForm'
  requirements:
    _permission: 'access content'
    parent: \d+
    node: \d+
decreto_content_modify.memo_add:
  path: '/memo/add/{bullet_point}'
  options:
    parameters:
      bullet_point:
        type: entity:node
  defaults:
    _title: 'Decreto add memo'
    _form: '\Drupal\decreto_content_modify\Form\MemoEditForm'
    bullet_point: null
  requirements:
    _permission: 'access content'
    bullet_point: \d+

decreto_content_modify.memo_edit:
