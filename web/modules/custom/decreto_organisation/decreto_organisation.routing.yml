decreto_organisation.organisation_popup_content:
  path: '/ajax/organisations-popup'
  defaults:
    _controller: '\Drupal\decreto_organisation\Controller\OrganisationController::popupContentRender'
  requirements:
    _permission: 'access content'
decreto_organisation.organisation_switch:
  path: '/organisation-switch/{organisation}'
  defaults:
    _controller: '\Drupal\decreto_organisation\Controller\OrganisationController::switchOrganisation'
  options:
    parameters:
      organisation:
        type: entity:node
  requirements:
    _permission: 'access content'
    organisation: \d+
decreto_organisation.organisations_add:
  path: '/organisations/add'
  defaults:
    _title_callback: '\Drupal\decreto_organisation\Form\OrganisationEditForm::getTitle'
    _form: '\Drupal\decreto_organisation\Form\OrganisationEditForm'
    organisation: null
  requirements:
    _permission: 'create decreto_organisation content'
decreto_organisation.organisations_edit:
  path: '/organisations/{organisation}/edit'
  options:
    parameters:
      organisation:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_organisation\Form\OrganisationEditForm::getTitle'
    _form: '\Drupal\decreto_organisation\Form\OrganisationEditForm'
  requirements:
    _permission: 'edit any decreto_organisation content'
    organisation: \d+
decreto_organisation.organisations_delete:
  path: '/organisations/{organisation}/delete'
  options:
    parameters:
      organisation:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\decreto_organisation\Form\OrganisationDeleteForm::getTitle'
    _form: '\Drupal\decreto_organisation\Form\OrganisationDeleteForm'
  requirements:
    _permission: 'delete any decreto_organisation content'
    organisation: \d+
