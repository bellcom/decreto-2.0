decreto_department.departments_add:
  path: '/departments/add'
  options:
    parameters:
      department:
        type: entity:taxonomy_term
  defaults:
    _title_callback: '\Drupal\decreto_department\Form\DepartmentEditForm::getTitle'
    _form: '\Drupal\decreto_department\Form\DepartmentEditForm'
    department: null
  requirements:
    _permission: 'create terms in decreto_tax_department'
decreto_department.departments_edit:
  path: '/departments/{department}/edit'
  options:
    parameters:
      department:
        type: entity:taxonomy_term
  defaults:
    _title_callback: '\Drupal\decreto_department\Form\DepartmentEditForm::getTitle'
    _form: '\Drupal\decreto_department\Form\DepartmentEditForm'
  requirements:
    _entity_access: 'department.update'
    department: \d+
decreto_department.departments_delete:
  path: '/departments/{department}/delete'
  options:
    parameters:
      department:
        type: entity:taxonomy_term
  defaults:
    _title_callback: '\Drupal\decreto_department\Form\DepartmentDeleteForm::getTitle'
    _form: '\Drupal\decreto_department\Form\DepartmentDeleteForm'
  requirements:
    _entity_access: 'department.delete'
    department: \d+
decreto_department.users_add:
  path: '/departments/{department}/add-user'
  options:
    parameters:
      department:
        type: entity:taxonomy_term
  defaults:
    _title_callback: '\Drupal\decreto_department\Form\DepartmentUserAddForm::getTitle'
    _form: '\Drupal\decreto_department\Form\DepartmentUserAddForm'
  requirements:
    _entity_access: 'department.update'
    department: \d+
