uuid: 0e2c9fdd-3397-433b-91a1-63026aec13f6
langcode: en
status: true
dependencies:
  module:
    - search_api_solr
    - node
    - search_api
    - search_api_attachments
  config:
    - field.storage.node.body
    - search_api.server.decreto_search_api_solr_server
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    advanced:
      index_prefix: ''
      collection: ''
id: decreto_meeting_contents_index
name: 'Decreto meeting contents index'
description: "Index that is used for searching inside of the meeting (indexes BPs and BPAs)\r\n"
read_only: false
field_settings:
  body:
    label: Body
    datasource_id: 'entity:node'
    property_path: body
    type: text
    boost: !!float 8
    dependencies:
      config:
        - field.storage.node.body
  bp_nid:
    label: 'BPA related Bullet point ID'
    datasource_id: 'entity:node'
    property_path: 'search_api_reverse_entity_references_node__field_decreto_bp_bpas:nid'
    type: integer
  meeting_nid:
    label: 'BP / BPA Meeting ID'
    datasource_id: 'entity:node'
    property_path: dummy_field
    type: integer
    configuration:
      dummy_value: '0'
  nid:
    label: ID
    datasource_id: 'entity:node'
    property_path: nid
    type: integer
    dependencies:
      module:
        - node
  node_grants:
    label: 'Node access information'
    property_path: search_api_node_grants
    type: string
    indexed_locked: true
    type_locked: true
    hidden: true
  saa_field_decreto_bpa_file:
    label: 'BPA File'
    property_path: saa_field_decreto_bpa_file
    type: text
    boost: !!float 5
  status:
    label: Published
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
    indexed_locked: true
    type_locked: true
    dependencies:
      module:
        - node
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: !!float 21
    dependencies:
      module:
        - node
  type:
    label: 'Content type'
    datasource_id: 'entity:node'
    property_path: type
    type: string
    dependencies:
      module:
        - node
  uid:
    label: uid
    datasource_id: 'entity:node'
    property_path: uid
    type: integer
    indexed_locked: true
    type_locked: true
    dependencies:
      module:
        - node
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - decreto_bullet_point
        - decreto_bullet_point_attachment
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
